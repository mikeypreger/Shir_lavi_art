<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shir Lavi | Interaction course works</title>
  <meta name="description" id="meta-description" content="Images and videos by Shir Lavi, made for her interaction course.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M18 26c0 8-2 14-3 17h18c-1-3-3-9-3-17z' fill='%23fff' stroke='%233b3247' stroke-width='3'/%3E%3Cpath d='M6 26C6 12 16 5 24 5s18 7 18 21z' fill='%23f2bfc0' stroke='%233b3247' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <svg class="sprites" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="mushroom" viewBox="0 0 48 48">
      <g stroke="#3b3247" stroke-width="2" stroke-linejoin="round">
        <path d="M18 26c0 8-2 14-3 17h18c-1-3-3-9-3-17z" fill="#fff"/>
        <path d="M6 26C6 12 16 5 24 5s18 7 18 21z" fill="currentColor"/>
      </g>
      <g fill="#fff">
        <circle cx="17" cy="17" r="3.5"/>
        <circle cx="29" cy="12" r="3"/>
        <circle cx="33" cy="21" r="2.5"/>
      </g>
    </symbol>
    <symbol id="dwarf" viewBox="0 0 80 120">
      <g stroke="#3b3247" stroke-width="2" stroke-linejoin="round">
        <ellipse cx="28" cy="111" rx="11" ry="6" fill="#b8a9d0"/>
        <ellipse cx="52" cy="111" rx="11" ry="6" fill="#b8a9d0"/>
        <path d="M23 76c-5 12-5 26-3 33h40c2-7 2-21-3-33z" fill="#bcd8c4"/>
        <circle cx="40" cy="54" r="18" fill="#f7dfd2"/>
        <path d="M21 56c5 5 11 7 19 7s14-2 19-7c4 18-6 36-19 41-13-5-23-23-19-41z" fill="#fff"/>
        <path d="M20 45C22 28 31 12 45 4c3 14 12 28 15 41-13 4-27 4-40 0z" fill="#f2bfc0"/>
        <circle cx="40" cy="59" r="5" fill="#f2bfc0"/>
      </g>
      <g fill="#3b3247">
        <circle cx="32" cy="53" r="2"/>
        <circle cx="48" cy="53" r="2"/>
      </g>
    </symbol>
  </svg>

  <a class="skip-link" href="#works-heading" data-i18n="skip"></a>

  <header class="site-header">
    <div class="site-name">
      <svg class="name-mushroom" aria-hidden="true"><use href="#mushroom"/></svg>
      <div>
        <h1 data-i18n="name"></h1>
        <p class="lede" data-i18n="lede"></p>
      </div>
    </div>
    <div class="site-actions">
      <button class="button button-quiet" type="button" id="lang-toggle"></button>
      <button class="button" type="button" id="add-button" data-i18n="add"></button>
    </div>
  </header>

  <main class="works">
    <div class="works-header">
      <h2 id="works-heading" tabindex="-1" data-i18n="works"></h2>
      <p class="works-count" id="works-count"></p>
    </div>
    <div class="empty" id="empty-state" hidden>
      <svg class="empty-dwarf" aria-hidden="true"><use href="#dwarf"/></svg>
      <p id="empty-message" data-i18n="empty"></p>
    </div>
    <ul class="gallery" id="gallery"></ul>
  </main>

  <footer class="site-footer" aria-hidden="true">
    <div class="scene">
      <svg class="scene-mushroom scene-small tint-lilac"><use href="#mushroom"/></svg>
      <svg class="scene-dwarf"><use href="#dwarf"/></svg>
      <svg class="scene-mushroom tint-rose"><use href="#mushroom"/></svg>
      <svg class="scene-mushroom scene-small tint-sky"><use href="#mushroom"/></svg>
    </div>
  </footer>

  <dialog class="upload-dialog" id="upload-dialog" aria-labelledby="upload-heading">
    <form class="upload" id="upload-form" novalidate>
      <h2 id="upload-heading" data-i18n="add"></h2>

      <div class="field">
        <label class="dropzone" id="dropzone" for="file-input">
          <span class="dropzone-title" id="dropzone-title" role="status" dir="auto"></span>
          <span class="dropzone-hint" data-i18n="dropHint"></span>
        </label>
        <input class="visually-hidden" type="file" id="file-input" accept="image/*,video/*" aria-describedby="file-error">
        <p class="error" id="file-error" role="alert"></p>
        <div class="preview" id="preview" hidden></div>
      </div>

      <div class="field">
        <label for="title-input"><span data-i18n="titleLabel"></span> <span class="optional" data-i18n="optional"></span></label>
        <input type="text" id="title-input" maxlength="120" dir="auto" autocomplete="off">
      </div>

      <div class="field">
        <label for="description-input"><span data-i18n="descriptionLabel"></span> <span class="optional" data-i18n="optional"></span></label>
        <textarea id="description-input" rows="4" dir="auto"></textarea>
      </div>

      <p class="storage-note" data-i18n="storageNote"></p>

      <div class="form-actions">
        <button class="button" type="submit" id="submit-button" data-i18n="submit"></button>
        <button class="button button-quiet" type="button" id="upload-close" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-caption">
    <button class="button button-quiet viewer-close" type="button" id="viewer-close" data-i18n="close"></button>
    <img id="viewer-image" alt="">
    <p class="viewer-caption" id="viewer-caption" dir="auto"></p>
  </dialog>

  <div class="visually-hidden" id="announcer" role="status"></div>
</body>
</html>
